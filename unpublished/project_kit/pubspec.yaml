name: project_kit
description: A set of developer utilities for flutter projects
version: 1.14.9
publish_to: 'none'

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  collection: ^1.18.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fluttertoast: ^8.2.4
  proxima_logger: ^0.7.2
  path_provider: ^2.1.1
  dio: ^5.4.1

  flutter_svg: ^2.0.9
  gap: ^3.0.1

  dart_code_metrics_presets: ^2.25.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  lints: ^3.0.0
  build_runner: ^2.4.8
  flutter_gen_runner: ^5.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  auto_exporter: ^3.0.2
  melos: ^4.1.0
