# App Update API v4 - Example Configuration
# Демонстрация основных возможностей

content:
  # Базовый контент (английский)
  - data:
      title: "Update $appName"
      description: "Version $releaseVersion is available"
      update_button: "Update"
      skip_button: "Skip"
      postpone_button: "Later"
      release_notes_title: "What's new?"

  # Русская локализация
  - when: { locale_is: ru }
    data:
      title: "Обновите $appName"
      description: "Версия $releaseVersion доступна"
      update_button: "Обновить"
      skip_button: "Пропустить"
      postpone_button: "Позже"
      release_notes_title: "Что нового?"

  # Критические обновления
  - when:
      app_status_is: [deprecated, unsupported]
      locale_is: ru
    data:
      title: "Важное обновление"
      description: "Обновитесь как можно скорее"

settings:
  # Базовые настройки: скрыто по умолчанию
  - data:
      should_show: false
      can_skip: false
      can_postpone: false
      skip_release_delay_hours: 2160
      skip_all_releases_delay_hours: 72
      postpone_release_delay_hours: 96
      postpone_all_releases_delay_hours: 24

  # Unsupported — блокирующее
  - when: { app_status_is: unsupported }
    data:
      should_show: true
      can_skip: false
      can_postpone: false

  # Deprecated — можно отложить
  - when: { app_status_is: deprecated }
    data:
      should_show: true
      can_postpone: true
      postpone_release_delay_hours: 24

  # Active/Outdated — полная свобода
  - when: { app_status_is: [active, outdated] }
    data:
      should_show: true
      can_skip: true
      can_postpone: true

  # Таргет-специфичные настройки
  - when:
      app_status_is: outdated
      view_target_is: [card, toast, aboutScreen]
    data:
      should_show: true

app_settings:
  # По умолчанию активные
  - data:
      app_status: active

  # Lifecycle от даты нового релиза
  - when: { app_version_is: any }
    rollout:
      date: $updateReleaseDate
      delay_hours: 48
      gradual_rollout_hours: 72
    data:
      app_status: outdated

  # Lifecycle от даты текущей версии
  - when: { app_version_is: any }
    rollout:
      date: $localReleaseDate
      delay_hours: 2880
      gradual_rollout_hours: 168
    data:
      app_status: deprecated

  - when: { app_version_is: any }
    rollout:
      date: $localReleaseDate
      delay_hours: 6760
    data:
      app_status: unsupported

  # Версионные ограничения
  - when: { app_version_is: "<4.0.0" }
    data:
      app_status: deprecated

  # Контролируемая раскатка
  - when: { app_version_is: "<=3.0.0" }
    rollout:
      date: "2024-01-01"
      delay_hours: 12
      gradual_rollout_hours: 72
      user_segmentation_percent: 10
    data:
      app_status: unsupported

sources:
  - name: appStore
    platforms: [ios, macos]
    content:
      - data:
          update_url: "https://apps.apple.com/app/id123"

  - name: googlePlay
    platforms: [android]
    content:
      - data:
          update_url: "https://play.google.com/store/apps/details?id=$appPackageName"

  - name: ruStore
    platforms: [android]
    content:
      - data:
          update_url: "https://apps.rustore.ru/app/$appPackageName"
      - when: { locale_is: ru }
        data:
          update_button: "Перейти в RuStore"

  - name: github
    platforms: [android, windows, macos, linux]
    content:
      - data:
          update_url: "https://github.com/user/repo/releases"

releases:
  - version: "2.1.0"
    date: "2024-08-24 15:35:00"
    content:
      - data:
          release_notes: |
            # Update v2.1.0
            - Enhanced user interface
            - Bug fixes
      - when: { locale_is: ru }
        data:
          release_notes: |
            # Обновление v2.1.0
            - Улучшенный интерфейс
            - Исправления ошибок
    sources: [googlePlay, appStore, ruStore]

  - version: "2.0.5"
    date: "2024-08-20 12:00:00"
    sources:
      - googlePlay
      - appStore
      - name: ruStore
        platforms: [android]
        release_override:
          version: "2.0.6"
        content:
          - when: { locale_is: ru }
            data:
              title: "Обновление RuStore"

  - version: "2.0.0-beta.1"
    date: "2024-09-01 10:00:00"
    content:
      - when:
          custom_params:
            user_tier_is: [beta, internal]
        data:
          title: "Beta Update"
          release_notes: "Beta features for testing"
    settings:
      - data: { should_show: false }
      - when:
          custom_params:
            user_tier_is: [beta, internal]
        data: { should_show: true }
    sources: [googlePlay]
