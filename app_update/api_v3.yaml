content:
  - view: card
    app_status: all
    locale: all
    data:
      title: Обновите приложение
      description: Описание
      custom_img: 
        url: https://example.com
        border_radius: 10
  - view: all
    locale: ru
    app_status: 
      - outdated
      - deprecated
    data:
      title: Обновите приложение
      description: Описание

settings:
  - view: all
    app_status: unsupported
    data:
      reminder_period_hours: 96
      rollout_hours: 96
      delay_hours: 20
      can_skip_release: true
      can_postpone_release: true
  - view: 
      - card
      - dialog
    app_status: 
      - unsupported
      - deprecated
      - custom_app_status
    data:
      postpone_delay_hours: 96
      can_skip_release: true
      can_postpone_release: true
      rollout:
        - delay_hours: 20
          rollout_hours: 96
  - view: all
    app_status: active
    data:
      should_show_release: false


version_rules:
  # All versions before 1.0.0 are unsupported
  - version: '<=1.0.0'
    rollout:
      - app_status: unsupported

  # All versions after 6.0.0 are active
  - version: '>=6.0.0'
    rollout:
      - app_status: active

  # All versions before 2.0.0 are unsupported after 2014-10-17 23:00:00
  - version: '<=2.0.0'
    date: 2014-10-17 23:00:00
    rollout:
      - app_status: unsupported
  
  # All versions before 3.0.0 are: 
  # unsupported after 2014-10-17 + 168+72 hours
  - version: '<=3.0.0'
    date: 2014-10-17
    rollout:
      - delay_hours: 168
        rollout_hours: 72
      - app_status: unsupported

  # All versions before 4.0.0 are:
  # outdated after 2014-10-17 + 10 days 
  # deprecated after 2014-10-17 + 144 days
  # unsupported after 2014-10-17 + 278 days
  - version: '>-=3.0.0 <4.0.0'
    date: 2014-10-17 00:00:00
    rollout:
      - delay_hours: 168 # 7 days
        rollout_hours: 72 # 3 days
        app_status: outdated
      - delay_hours: 2880  # 120 days
        rollout_hours: 336 # 14 days
        app_status: deprecated
      - date: 2015-01-01 00:00:00
        rollout_hours: 336 # 14 days
        app_status: unsupported

  # All matched versions are deprecated
  - version: ["<=5.1.0 >=4.2.0", ">5.6.0 <5.6.7"]
    rollout: 
      - app_status: deprecated


  # Sets the lifecycle of the application updates.
  # The `use_app_release_date` flag calculates the release of 
  # the current or first matched lower version
  # And uses it instead of `date`.
  # If the date is not found in the `releases` list,
  # then the `date` is used.
  #
  # All matched versions are:
  # outdated if is older than 10 days
  # deprecated if is older than 144 days
  # unsupported if is older than 278 days
  - version: all
    date: 2014-10-17 00:00:00
    use_app_release_date: true
    rollout:
      - delay_hours: 168 # 7 days
        rollout_hours: 72 # 3 days
        app_status: outdated
      - delay_hours: 2880  # 120 days
        rollout_hours: 336 # 14 days
        app_status: deprecated
      - delay_hours: 2880 # 120 days
        rollout_hours: 336 # 14 days
        app_status: unsupported

sources:
  - name: appStore
    url: https://example.com
    platforms:
      - macos
      - name: ios
        source:
          version_settings:
            unsupported_versions: ["1.8.3"]

  - name: appGallery
    url: https://example.com

  - name: ruStore
    url: https://example.com

    text:
      title: Title
    version_settings:
      unsupported_versions: ["<=4.2.0"]

  - name: gitHub
    url: https://example.com
    platforms:
      # Full syntax
      - name: android
        source:
          url: https://example.com/android
          text:
            title: Title
          version_settings:
            deprecated_versions: [">5.6.0 <5.6.7"]
      # Short syntax
      - windows
      - macos
      - linux

  - name: site
    platforms: [android]
    url: https://example.com

releases:
  - version: 0.3.7
    date: "2024-08-24 15:35:00"
    text:
      release_notes: |-
        # Big update!
        [click](https://example.com) - full changelog.
        ### Short notes
        - Added bugs
        - Fixed features
    settings:
      can_skip_release: true
      reminder_period_hours: 48
      release_delay_hours: 48
    sources:
      - googlePlay
      - appStore
      - ruStore
      - name: github
        source:
          url: https://example.com
          platforms: [android, ios, aurora]

  - version: 0.3.8+10-beta
    text:
      release_notes: Minor Improvements
    sources: []
    is_super_ultra_mega_release: true

  - version: 0.0.3+80
    text:
      release_notes: Improvements
    sources:
      - name: googlePlay
        date: 2014-10-17 23:00:00

  - version: 0.0.2+30
    sources: []

  - version: 1.2.0
    text:
      release_notes: Improvements
    settings:
      can_skip_release: true
    sources:
      - appStore
      - name: googlePlay
      - name: ruStore
        url: www.example.com
        platforms: [android]
        release:
          version: 1.2.1
          text:
            title: RuStore Title
      - name: github
        url: https://github.com/hiddify/hiddify-next/releases/
        release:
          date: 2014-10-20 12:00:00
        platforms:
          - macos
          - linux
          - name: windows
            source:
              url: https://github.com/hiddify/hiddify-next/releases/download/v0.14.0/hiddify-windows-x64-setup.zip
              release:
                text:
                  ru:
                    release_notes: Windows Github release notes
                settings:
                  can_skip_release: false
       

  - version: 0.2.4
    date: 2014-10-17 23:00:00Z
    text:
      title: Title
      description: Description
      release_notes: Note
    settings:
      can_skip_release: true
    sources:
      - name: googlePlay
        url: www.example.com
        release:
          date: 2014-10-17 23:00:00
          settings:
            can_skip_release: false
        platforms:
          - name: android
            source:
              release:
                settings:
                  dialog:
                    outdated:
                      can_skip_release: true

      - name: appStore
        text:
          release_notes: note ios
        date: 2014-10-18 23:00:00

  - version: 0.2.6
    date: 2014-10-17 23:00:00
    text:
      release_notes: Note
      title: Title
      description: Description
    settings:
      can_skip_release: true
    sources:
      - name: googlePlay
        url: null
        platforms: []

  - version: 0.2.5
    text:
      title: Title
      description: Description
      release_notes: Note
    sources:
      - googlePlay
      - name: appStore
        platforms: ['ios']
    


      
