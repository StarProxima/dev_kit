# Набор правил для контента релизов, содержит строки и прочую инфу по конретному обновлению
# Создается набор правил, которые поочередно применяются к конкретному релизу,
# если они подходят под условия.
# Т.е. для релиза может примениться несколько правил, последние более приоритетны.
content:
  - display_target: card
    app_status: all
    locale: all
    data:
      title: Обновите приложение
      description: Описание
      custom_img: 
        url: https://example.com
        border_radius: 10

  - display_target: all
    locale: ru
    app_status: 
      - outdated
      - deprecated
    data:
      title: Обновите приложение
      description: Описание

# Набор правил для настроек релизов
# Действует такая же логика с правилами, что и для контента
settings:
  # Задаем настройки по умолчанию для всех релизов
  - app_status: all
    display_target: all
    data:
      # Выключаем отображение по умолчанию,
      # чтобы включить для конкретных таргетов
      should_show: false

      can_skip: false      
      skip_settings:
        release_delay_hours: 2160
        all_releases_delay_hours: 72

      can_postpone: false
      postpone_settings:
        release_delay_hours: 96
        all_releases_delay_hours: 24

      can_view: false
      view_settings:
          release_delay_hours: 8
          all_releases_delay_hours: 0

  # Настраиваем actions для статусов
  
  - app_status: unsupported
    display_target: all
    data:   
      can_skip: false
      can_postpone: false
      can_view: false

  - app_status: deprecated
    display_target: all
    data:
      can_postpone: true
      can_view: true
      postpone_settings:
        release_delay_hours: 24
        all_releases_delay_hours: 24
  
  - app_status: 
      - outdated
      - updateable
      - active
    display_target: all
    data:   
      can_skip: true
      can_postpone: true
      can_view: true

  # Настраиваем отображение по каждому статусу для конкретных таргетов,
  # чтобы настроить гибкое отображение в зависимости от статуса

  - app_status: active
    display_target: about_screen
    data:
      should_show: true
  
  - app_status: updateable
    display_target: 
      - about_screen
      - card
    data:
      should_show: true

  - app_status: outdated
    display_target: 
      - about_screen
      - card
      - profile_badge
      - toast
    data:
      should_show: true

  - app_status: deprecated
    display_target: 
      - about_screen
      - card
      - profile_badge
      - screen
    data:
      should_show: true

  - app_status: unsupported
    display_target: screen
    data:
      should_show: true

# Правила для версий
# Позволяет гибко задать настройки и распределить версии по статусам,
# учитывая rollout и date.
# Применяется первое подходящее правило (и последнее в rollout),
# устанавливая app_status и release_status.
version_rules:
  # All versions before 1.0.0 are unsupported
  - version: '<=1.0.0'
    app_status: unsupported
    # Релизы с такой не будут доступны для обновления
    release_status: discontinued

  # All versions after 6.0.0 are active
  - version: '>=6.0.0'
    rollout:
      - app_status: active

  # All versions before 2.0.0 are unsupported after 2014-10-17 23:00:00
  - version: '<=2.0.0'
    date: 2014-10-17 23:00:00
    sources:
      - GooglePlay
      - name: AppStore
        platforms:
          - ios
    app_status: unsupported

  
  # All versions before 3.0.0 are: 
  # unsupported after 2014-10-17 + 168+72 hours
  - version: '<=3.0.0'
    date: 2014-10-17
    rollout:
      - delay_hours: 12
        rollout_hours: 72
        segmentation_percent: 10
        app_status: unsupported

      - date: 2014-10-17
        rollout_hours: 72
        segmentation_percent: 50
        app_status: unsupported

  # All versions before 4.0.0 are:
  # outdated after 2014-10-17 + 10 days 
  # deprecated after 2014-10-17 + 144 days
  # unsupported after 2014-10-17 + 278 days
  - version: '>-=3.0.0 <4.0.0'
    date: 2014-10-17 00:00:00
    rollout:
      - delay_hours: 168 # 7 days
        rollout_hours: 72 # 3 days
        app_status: outdated
      - delay_hours: 2880  # 120 days
        rollout_hours: 336 # 14 days
        app_status: deprecated
      - date: 2015-01-01 00:00:00
        rollout_hours: 336 # 14 days
        app_status: unsupported

  # All matched versions are deprecated
  - version: ["<=5.1.0 >=4.2.0", ">5.6.0 <5.6.7"]
    app_status: deprecated 


  # Sets the lifecycle of the application updates.
  # The `date: app_release` parameter calculates the release of 
  # the current or nearest  version and uses it instead of `date`.
  # If the date is not found in the `releases` list,
  # then rule is not applied.
  #
  # All matched versions are:
  # outdated if is older than 10 days
  # deprecated if is older than 144 days
  # unsupported if is older than 278 days
  - version: all
    date: app_release
    rollout:
      - delay_hours: 168 # 7 days
        rollout_hours: 72 # 3 days
        app_status: outdated
      - delay_hours: 2880  # 120 days
        rollout_hours: 336 # 14 days
        app_status: deprecated
      - delay_hours: 2880 # 120 days
        rollout_hours: 336 # 14 days
        app_status: unsupported

  # Задает жизненный цикл релизов
  # The `date: update_release` parameter take date from 
  # latest matched release and uses it instead of `date`.
  - version: all
    date: update_release
    rollout:
      - app_status: active
      - delay_hours: 48  # 2 days
        rollout_hours: 72 # 3 days
        app_status: outdated

  - version: all
    app_status: active


sources:
  - name: appStore
    url: https://example.com
    platforms:
      - macos
      - name: ios

  - name: appGallery
    url: https://example.com

  - name: ruStore
    url: https://example.com

    content:
      title: Title

  - name: gitHub
    url: https://example.com
    platforms:
      # Full syntax
      - name: android
        source:
          url: https://example.com/android
          content:
            title: Title
      # Short syntax
      - windows
      - macos
      - linux

  - name: site
    platforms: [android]
    url: https://example.com

releases:
  - version: 0.3.7
    # Local time
    date: "2024-08-24 15:35:00"
    content:
      release_notes: |-
        # Big update!
        [click](https://example.com) - full changelog.
        ### Short notes
        - Added bugs
        - Fixed features
    app_status: unsupported
    sources:
      - googlePlay
      - appStore
      - ruStore
      - name: github
        source:
          url: https://example.com
          platforms: [android, ios, aurora]

  - version: 0.3.8+10-beta
    content:
      release_notes: Minor Improvements
    sources: []
    is_super_ultra_mega_release: true

  - version: 0.0.3+80
    content:
      release_notes: Improvements
    sources:
      - name: googlePlay
        date: 2014-10-17 23:00:00

  - version: 0.0.2+30
    sources: []

  - version: 1.2.0
    content:
      release_notes: Improvements
    sources:
      - appStore
      - name: googlePlay
      - name: ruStore
        url: www.example.com
        platforms: [android]
        release:
          version: 1.2.1
          content:
            title: RuStore Title
      - name: github
        url: https://github.com/hiddify/hiddify-next/releases/
        release:
          date: 2014-10-20 12:00:00
        platforms:
          - macos
          - linux
          - name: windows
            source:
              url: https://github.com/hiddify/hiddify-next/releases/download/v0.14.0/hiddify-windows-x64-setup.zip
              release:
                content:
                  ru:
                    release_notes: Windows Github release notes
                settings:
                  can_postpone: true
       

  - version: 0.2.4
    # UTC time
    date: 2014-10-17 23:00:00Z
    content:
      title: Title
      description: Description
      release_notes: Note
    settings:
      can_skip: true
      can_postpone: true
    sources:
      - name: googlePlay
        url: www.example.com
        release:
          date: 2014-10-17 23:00:00
          settings:
            can_postpone: true
        platforms:
          - name: android
            source:
              release:
                settings:
                  - target: dialog
                    app_status: outdated
                    data:
                      can_skip: true
                      can_postpone: true

      - name: appStore
        content:
          release_notes: note ios
        date: 2014-10-18 23:00:00

  - version: 0.2.6
    date: 2014-10-17 23:00:00
    content:
      release_notes: Note
      title: Title
      description: Description
    settings:
      can_skip_release: true
    sources:
      - name: googlePlay
        url: null
        platforms: []

  - version: 0.2.5
    content:
      title: Title
      description: Description
      release_notes: Note
    sources:
      - googlePlay
      - name: appStore
        platforms: ['ios']
    


      
