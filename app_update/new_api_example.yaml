settings:
  base:
    can_skip_release: true
    update_button_text: Go to Store
  dialog:
    unsupported:
      title: title
      description: description
      can_skip_release: true
    updatable:
      title: title
      description: description
      can_skip_release: true
  card:
    title: title
    description: description
    can_skip_release: true

version_settings:
  unsupported_versions: ["<=4.2.0", 0.3.4]
  deprecated_versions: ["<=5.1.0 >=4.2.0 ", ">5.6.0 <5.6.7"]

sources:
  - name: appStore
    url: https://example.com
    platforms:
      - macos
      - name: ios
        source:
          version_settings:
            unsupported_versions: ["1.8.3"]

  - name: appGallery
    url: https://example.com

  - name: ruStore
    url: https://example.com

    settings:
      title: Title
    version_settings:
      unsupported_versions: ["<=4.2.0"]

  - name: gitHub
    url: https://example.com
    platforms:
      # Full syntax
      - name: android
        source:
          url: https://example.com/android
          settings:
            title: Title
          version_settings:
            deprecated_versions: [">5.6.0 <5.6.7"]
      # Short syntax
      - windows
      - macos
      - linux

  - name: site
    platforms: [android]
    url: https://example.com

releases:
  - version: 0.3.7
    date: "2024-08-24 15:35:00"
    settings:
      release_notes: |-
        # Big update!
        [click](https://example.com) - full changelog.
        ### Short notes
        - Added bugs
        - Fixed features
      can_skip_release: true
      reminder_period_hours: 48
      release_delay_hours: 48
    sources:
      - googlePlay
      - appStore
      - ruStore
      - name: github
        source:
          url: https://example.com
          platforms: [android, ios, aurora]

  - version: 0.3.8+10-beta
    settings:
      release_notes: Minor Improvements
    sources: []
    is_super_ultra_mega_release: true

  - version: 0.0.3+80
    settings:
      release_notes: Improvements
    sources:
      - name: googlePlay
        date: 2014-10-17 23:00:00

  - version: 0.0.2+30
    sources: []

  - version: 1.2.0
    settings:
      release_notes: Improvements
      can_skip_release: true
    sources:
      - appStore
      - name: googlePlay
      - name: ruStore
        url: www.example.com
        platforms: [android]
        release:
          version: 1.2.1
          settings:
            title: RuStore Title
      - name: github
        url: https://github.com/hiddify/hiddify-next/releases/
        release:
          date: 2014-10-20 12:00:00
        platforms:
          - macos
          - linux
          - name: windows
            source:
              url: https://github.com/hiddify/hiddify-next/releases/download/v0.14.0/hiddify-windows-x64-setup.zip
              release:
                settings:
                  release_notes: Windows Github release notes
       

  - version: 0.2.4
    date: 2014-10-17 23:00:00
    settings:
      title: Title
      description: Description
      release_notes: Note
      can_skip_release: true
    sources:
      - name: googlePlay
        url: www.example.com
        release:
          date: 2014-10-17 23:00:00
          settings:
            can_skip_release: false
        platforms:
          - name: android
            source:
              release:
                settings:
                  dialog:
                    updatable:
                      can_skip_release: true

      - name: appStore
        settings:
          release_notes: note ios
        date: 2014-10-18 23:00:00

  - version: 0.2.6
    date: 2014-10-17 23:00:00
    settings:
      release_notes: Note
      title: Title
      description: Description
      can_skip_release: true
    sources:
      - name: googlePlay
        url: null
        platforms: []

  - version: 0.2.5
    settings:
      title: Title
      description: Description
      release_notes: Note
    sources:
      - googlePlay
      - name: appStore
