# Тестовая конфигурация: Критическое обновление
# Версия должна быть unsupported, нельзя пропустить или отложить

content:
  # Английский контент
  - data:
      title: "Critical Update Required"
      description: "Your version is no longer supported. Please update immediately."
      update_button: "Update Now"
      skip_button: "Skip"
      postpone_button: "Later"
      release_notes_title: "What's New"
      release_notes: |
        - Critical security fixes
        - Important bug fixes
        - Performance improvements
      
  # Русский контент
  - when: { locale_is: ru }
    data:
      title: "Требуется критическое обновление"
      description: "Ваша версия больше не поддерживается. Пожалуйста, обновитесь немедленно."
      update_button: "Обновить сейчас"
      skip_button: "Пропустить"
      postpone_button: "Позже"
      release_notes_title: "Что нового"
      release_notes: |
        - Критические исправления безопасности
        - Важные исправления ошибок
        - Улучшения производительности

settings:
  # По умолчанию не показываем
  - data:
      should_show: false
      can_skip: false
      can_postpone: false
      skip_release_delay_hours: 2160
      skip_all_releases_delay_hours: 72
      postpone_release_delay_hours: 96
      postpone_all_releases_delay_hours: 24
      
  # Критические обновления показываем без возможности пропустить
  - when: { app_status_is: unsupported }
    data:
      should_show: true
      can_skip: false
      can_postpone: false

app_settings:
  # По умолчанию все активные
  - data:
      app_status: active
      
  # Версии ниже 2.0.0 - unsupported
  - when: { app_version_is: "<2.0.0" }
    data:
      app_status: unsupported

sources:
  - name: googlePlay
    platforms: [android]
    
  - name: appStore
    platforms: [ios, macos]

releases:
  - version: "2.0.0"
    date: "2024-01-15 10:00:00"
    content:
      - data:
          release_notes: "Critical security update with important fixes"
      - when: { locale_is: ru }
        data:
          release_notes: "Критическое обновление безопасности с важными исправлениями"
    sources: [googlePlay, appStore]

