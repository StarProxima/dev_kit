# App Update API v4 Test Fixture - Enhanced Rule Structure
# Использует семантическую архитектуру when/rollout/data

content:
  - when:
      view_target_is: card
      app_status_is: any
      locale_is: any
      source_is:
        - name: gitHub
          platforms:
            - android
            - ios
      app_version_is: any
    rollout:
      date: 2020-01-01
    data:
      title: Обновите приложение
      description: Описание
      custom_params:
        custom_img: 
          url: https://example.com
          border_radius: 10

  - when:
      view_target_is: any
      locale_is: ru
      app_status_is: 
        - outdated
        - deprecated
    data:
      title: Обновите приложение
      description: Описание

# Набор правил для настроек релизов
settings:
  # Задаем настройки по умолчанию для всех релизов
  - when:
      app_status_is: any
      view_target_is: any
    data:
      # Выключаем отображение по умолчанию,
      # чтобы включить для конкретных таргетов
      should_show: false

      can_skip: false      
      skip_release_delay_hours: 2160
      skip_all_releases_delay_hours: 72

      can_postpone: false
      postpone_release_delay_hours: 96
      postpone_all_releases_delay_hours: 24

  # Настраиваем actions для статусов
  
  - when:
      app_status_is: unsupported
      view_target_is: any
    data:   
      can_skip: false
      can_postpone: false

  - when:
      app_status_is: deprecated
      view_target_is: any
    data:
      can_postpone: true
      postpone_release_delay_hours: 24
      postpone_all_releases_delay_hours: 24
  
  - when:
      app_status_is: 
        - outdated
        - updateable
        - active
      view_target_is: any
    data:   
      can_skip: true
      can_postpone: true

  # Настраиваем отображение по каждому статусу для конкретных таргетов
  - when:
      app_status_is: active
      view_target_is: aboutScreen
    data:
      should_show: true
  
  - when:
      app_status_is: updateable
      view_target_is: 
        - aboutScreen
        - card
    data:
      should_show: true

  - when:
      app_status_is: outdated
      view_target_is: 
        - aboutScreen
        - card
        - profileBadge
        - toast
    data:
      should_show: true

  - when:
      app_status_is: deprecated
      view_target_is: 
        - aboutScreen
        - card
        - profileBadge
        - screen
    data:
      should_show: true

  - when:
      app_status_is: unsupported
      view_target_is: screen
    data:
      should_show: true

# Правила для приложения
app_settings:
  - when:
      app_version_is: any
    data:
      app_status: active

  # Задает жизненный цикл релизов
  - when:
      app_version_is: any
    rollout:
      date: $updateReleaseDate
    data:
      app_status: active

  - when:
      app_version_is: any
    rollout:
      date: $updateReleaseDate
      delay_hours: 48  # 2 days
      gradual_rollout_hours: 72 # 3 days
    data:
      app_status: outdated

  # Lifecycle от локальной версии
  - when:
      app_version_is: any
    rollout:
      date: $localReleaseDate
      delay_hours: 168 # 7 days
      gradual_rollout_hours: 72 # 3 days
    data:
      app_status: outdated
      
  - when:
      app_version_is: any
    rollout:
      date: $localReleaseDate
      delay_hours: 2880 # 120 days
      gradual_rollout_hours: 168 # 7 days
    data:
      app_status: deprecated
      
  - when:
      app_version_is: any
    rollout:
      date: $localReleaseDate
      delay_hours: 6760 # 240 days
      gradual_rollout_hours: 168 # 7 days
    data:
      app_status: unsupported

  # Версионные ограничения
  - when:
      app_version_is: ["<=5.1.0 >=4.2.0", ">5.6.0 <5.6.7"]
    data:
      app_status: deprecated 

  # Legacy versions lifecycle
  - when:
      app_version_is: '<4.0.0'
    rollout:
      date: 2014-10-17 00:00:00
      delay_hours: 168 # 7 days
      gradual_rollout_hours: 72 # 3 days
    data:
      app_status: outdated
      
  - when:
      app_version_is: '<4.0.0'
    rollout:
      date: 2014-10-17 00:00:00
      delay_hours: 2880 # 120 days
      gradual_rollout_hours: 168 # 7 days
    data:
      app_status: deprecated
      
  - when:
      app_version_is: '<4.0.0'
    rollout:
      date: 2015-01-01 00:00:00
      delay_hours: 6720 # 280 days
      gradual_rollout_hours: 336 # 14 days
    data:
      app_status: unsupported

  # Source-specific rules
  - when:
      app_version_is: '<=2.0.0'
      source_is:
        - GooglePlay
        - name: AppStore
          platforms:
            - ios
    rollout:
      date: 2014-10-17 23:00:00
    data:
      app_status: unsupported

  # Modern versions
  - when:
      app_version_is: '>=6.0.0'
    data:
      app_status: active

  # Controlled rollout examples
  - when:
      app_version_is: '<=3.0.0'
    rollout:
      date: 2014-10-17
      delay_hours: 12
      gradual_rollout_hours: 72
      user_segmentation_percent: 10
    data:
      app_status: unsupported

  - when:
      app_version_is: '<=3.0.0'
    rollout:
      date: 2014-10-17
      gradual_rollout_hours: 72
      user_segmentation_percent: 50
    data:
      app_status: unsupported

  # Final fallback
  - when:
      app_version_is: '<=1.0.0'
    data:
      app_status: unsupported

sources:
  - name: appStore
    content:
      - data:
          update_url: https://example.com
    platforms:
      - macos
      - name: ios

  - name: appGallery
    content:
      - data:
          update_url: https://example.com
      - when:
          locale_is: ru
        data:
          update_button: Перейти в AppGallery
      - when:
          locale_is: en
        data:
          update_button: Go to AppGallery

  - name: ruStore
    content:
      - data:
          update_url: https://example.com

  - name: gitHub
    content:
      - data:
          update_url: https://example.com
    platforms:
      # Full syntax
      - name: android
        content:
          - data:
              update_url: https://example.com/android
              title: Title
          
      # Short syntax
      - windows
      - macos
      - linux

  - name: site
    platforms: [android]
    content:
      - data:
          update_url: https://example.com

