# Тестовый конфиг исправленный под реальную реализацию парсера
sources:
  - name: googlePlay
    url: https://play.google.com/store/apps/details?id={appPackageName}
    platforms: [android]
  - name: appStore  
    url: https://apps.apple.com/app/id123456789
    platforms: [ios]

content:
  # Общие правила (переопределяют все дефолтные)
  - data:
      update_url: https://play.google.com/store/apps/details?id={appPackageName}
      title: "Update Available"
      description: "New version {updateVersion} is available for {appName}"
      
  # Русская локализация (переопределяет общие для RU)
  - locale_is: ru
    data:
      title: "Доступно обновление"
      description: "Новая версия {updateVersion} доступна для {appName}"

settings:
  # Критические обновления для версий 2.x (переопределяем дефолтные)
  - app_version_is: ">=2.0.0 <3.0.0"
    data:
      can_skip: false
      can_postpone: false

app_settings:
  # Переопределяем для активных статусов (дефолтные правила остаются)
  - app_status_is: active
    data:
      app_status: outdated

releases:
  # Основной релиз для Android (в прошлом относительно тестовой даты 2024-01-15)
  - version: "2.0.0"
    date: "2024-01-01 00:00:00"
    sources: [googlePlay]
    
  # Релиз для iOS с переопределением только нужных полей
  - version: "2.0.1"
    date: "2024-01-10 00:00:00"
    sources: [appStore]
    content:
      - data:
          release_notes: "iOS-specific hotfix"
      
  # Еще один релиз для Android (в прошлом)  
  - version: "2.0.2"  
    date: "2024-01-14 00:00:00"
    sources: [googlePlay]
    content:
      - data:
          release_notes: "Release with feature flags"
      
  # Релиз для будущего тестирования (в будущем)
  - version: "2.1.0"
    date: "2024-01-20 00:00:00"
    sources: [googlePlay]
    content:
      - data:
          release_notes: "Future release"
